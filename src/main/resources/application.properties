# Spring Boot의 환결 설정 파일. application.yaml 형식으로도 가능함
spring.application.name=shop

debug=true
# 기본포트 : 8080
server.port=8888

# mariaDB 설정
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.read-only=false
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.maximum-pool-size=20

# 파일 업로드
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB

# jsp view
#spring.mvc.view.prefix=/WEB-INF/views/
#spring.mvc.view.suffix=.jsp

# message
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# 개발자 환경 값
resources.dir=c:/dev/spring-boot/shop/src/main/resources/

## OpenAI
# ${OPENAI_API_KEY} : 환경변수에 설정이 필요
spring.ai.openai.api-key=${OPENAI_API_KEY}

## Mail 관련 설정
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GOOGLE_MAIL_ID}
spring.mail.password=${GOOGLE_MAIL_PW}
spring.mail.properties.mailDto.smtp.auth=true
spring.mail.properties.mailDto.smtp.starttls.enable=true
my.mail.sender=${MAIL_SENDER:${GOOGLE_MAIL_ID}}

# NAVER 설정
my.naver.id=${NAVER_MAIL_ID}
my.naver.pw=${NAVER_MAIL_PW}