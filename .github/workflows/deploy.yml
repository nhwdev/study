name: Docker Deploy to EC2

# Git Action이 실행될 조건: main 브랜치에 코드가 push될 때 자동 실행
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2 With Docker
    runs-on: ubuntu-latest # GitHub에서 제공하는 최신 Ubuntu 가상 환경에서 실행

    steps:
      # 1. GitHub 저장소의 소스 코드를 빌드 환경으로 내려받기
      - name: Checkout Source code
        uses: actions/checkout@v3

      # 2. Docker 빌드를 위한 환경 설정
      - name: Setup Docker
        uses: docker/setup-buildx-action@v2

      # 3. Docker Hub 로그인을 위한 계정 정보 확인
      - name: Docker Hub Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_PASSWORD }} # (주의: 코드상에 오타가 있었는데 수정했습니다)

      # 4. Dockerfile을 기반으로 Docker 이미지 빌드 (run_number로 버전 관리)
      - name: Build Docker image
        run: docker build -t nohker/shop:${{ github.run_number }} .

      # 5. 빌드된 이미지를 DockerHub(클라우드 저장소)에 전송 (Push)
      - name: Push Docker Image to DockerHub
        run: docker push nohker/shop:${{ github.run_number }}

      # 6. EC2 서버에 접속하여 이미지를 받아오고 컨테이너 실행
      - name: Run Docker container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}       # EC2 서버 IP 주소
          username: ${{ secrets.EC2_USER }}   # EC2 서버 계정명
          key: ${{ secrets.EC2_KEY }}         # EC2 접속용 프라이빗 키
          script: |
            # 6-1. 기존에 실행 중인 'shop' 컨테이너가 있다면 중지 및 삭제 (오류 발생 시 무시)
            docker stop shop || true
            docker rm shop || true
            
            # 6-2. Docker Hub에서 최신 빌드된 이미지를 다운로드 (Pull)
            docker pull nohker/shop:${{ github.run_number }}
            
            # 6-3. 새로운 이미지로 컨테이너 실행 (포트 8888 연결 및 볼륨 설정)
            docker run -d --name shop -p 8888:8888 \
            -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            -e GOOGLE_MAIL_ID="${{ secrets.GOOGLE_MAIL_ID }}" \
            -e GOOGLE_MAIL_PW="${{ secrets.GOOGLE_MAIL_PW }}" \
            -e NAVER_MAIL_ID="${{ secrets.NAVER_MAIL_ID }}" \
            -e NAVER_MAIL_PW="${{ secrets.NAVER_MAIL_PW }}" \
            -v /home/ubuntu/upload:/app/upload nohker/shop:${{ github.run_number }}
            
            # 6-4. 사용하지 않는 이전 이미지들을 삭제하여 서버 용량 확보
            docker image prune -a -f --filter "label!=keep"