name: Docker Deploy to EC2

# Git Action이 실행될 조건: main 브랜치에 코드가 push될 때 자동 실행
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2 With Docker
    runs-on: ubuntu-latest # GitHub에서 제공하는 최신 Ubuntu 가상 환경에서 실행

    steps:
      # 1. GitHub 저장소의 소스 코드를 빌드 환경으로 내려받기
      - name: Checkout Source code
        uses: actions/checkout@v3

      # 2. Docker 빌드를 위한 환경 설정
      - name: Setup Docker
        uses: docker/setup-buildx-action@v2

      # 3. Dockerfile을 기반으로 Docker 이미지 빌드 (run_number로 버전 관리)
      - name: Build Docker image
        run: docker build -t nohker/shop:${{ github.run_number }} .

      # 4. 빌드된 이미지를 전송하기 위해 .tar 파일로 압축/추출
      - name: Save Docker image as tar
        run: docker save nohker/shop:${{ github.run_number }} -o shop.tar

      # 5. 전송 전 파일 권한 설정 (읽기/쓰기 권한 부여)
      - name: Change tar file Permission
        run: sudo chmod 644 shop.tar

      # 6. 생성된 .tar 파일을 보안 통신(SCP)을 통해 EC2 서버로 전송
      - name: Copy image tar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}       # EC2 서버 IP 주소
          username: ${{ secrets.EC2_USER }}   # EC2 서버 계정명 (보통 ubuntu)
          key: ${{ secrets.EC2_KEY }}         # EC2 접속용 프라이빗 키(.pem 내용)
          source: "shop.tar"                  # 전송할 파일
          target: "/home/ubuntu"              # EC2 내 저장 경로

      # 7. EC2 서버에 접속하여 전송된 이미지를 로드하고 컨테이너 실행
      - name: Run Docker container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 기존에 실행 중인 컨테이너가 있다면 중지 및 삭제 (오류 발생 시 무시)
            docker stop shop || true
            docker rm shop || true
            
            # 이전 이미지 정리
            docker image prune -f
            
            # 전송된 .tar 파일에서 이미지 로드
            docker load -i /home/ubuntu/shop.tar
            
            # 새로운 이미지로 컨테이너 실행 (포트 8888 연결 및 볼륨 설정)
            docker run -d --name shop -p 8888:8888 \
            -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            -e GOOGLE_MAIL_ID="${{ secrets.GOOGLE_MAIL_ID }}" \
            -e GOOGLE_MAIL_PW="${{ secrets.GOOGLE_MAIL_PW }}" \
            -e NAVER_MAIL_ID="${{ secrets.NAVER_MAIL_ID }}" \
            -e NAVER_MAIL_PW="${{ secrets.NAVER_MAIL_PW }}" \
            -v /home/ubuntu/upload:/app/upload nohker/shop:${{ github.run_number }}